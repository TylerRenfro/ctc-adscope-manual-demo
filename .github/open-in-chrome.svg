<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Open index.html in Chrome</title>
  <desc id="desc">A Finder window showing the ctc-adscope-manual-demo-main folder in Downloads. index.html is being dragged out of the window and dropped on the Chrome icon in the Dock.</desc>

  <defs>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AA2FF"/>
      <stop offset="1" stop-color="#B796FF"/>
    </linearGradient>
    <filter id="window-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1B1640" flood-opacity="0.35"/>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B1640" flood-opacity="0.25"/>
    </filter>
    <clipPath id="window-clip">
      <rect x="100" y="28" width="560" height="380" rx="12"/>
    </clipPath>
    <clipPath id="finder-clip">
      <rect x="210" y="520" width="56" height="56" rx="13"/>
    </clipPath>
    <clipPath id="notes-clip">
      <rect x="346" y="520" width="56" height="56" rx="13"/>
    </clipPath>
    <symbol id="page" viewBox="0 0 50 62">
      <path d="M1 1H35L49 15V61H1Z" fill="#FFFFFF" stroke="#C7C7CC" stroke-linejoin="round"/>
      <path d="M35 1L49 15H35Z" fill="#ECECF0" stroke="#C7C7CC" stroke-linejoin="round"/>
      <path d="M8 22H30M8 28H38M8 34H26" stroke="#DCDCE1" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- Desktop -->
  <rect width="760" height="600" rx="18" fill="url(#wallpaper)"/>

  <!-- Finder window -->
  <g filter="url(#window-shadow)">
    <rect x="100" y="28" width="560" height="380" rx="12" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#window-clip)">
    <rect x="100" y="28" width="170" height="380" fill="#F2F2F6"/>
    <line x1="270.5" y1="28" x2="270.5" y2="408" stroke="#E2E2E7"/>
    <line x1="270" y1="80.5" x2="660" y2="80.5" stroke="#E5E5EA"/>
  </g>
  <rect x="100.5" y="28.5" width="559" height="379" rx="11.5" fill="none" stroke="#000000" stroke-opacity="0.12"/>

  <!-- Window controls -->
  <circle cx="122" cy="50" r="6.5" fill="#FF5F57"/>
  <circle cx="142" cy="50" r="6.5" fill="#FEBC2E"/>
  <circle cx="162" cy="50" r="6.5" fill="#28C840"/>

  <!-- Sidebar -->
  <text x="114" y="94" font-size="11" font-weight="600" fill="#8E8E93">Favorites</text>
  <rect x="108" y="216" width="154" height="24" rx="6" fill="#DADAE0"/>
  <g fill="none" stroke="#3B82F6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="116" r="6.5"/>
    <path d="M128 112.5V116L130.5 118"/>
    <rect x="121.5" y="137.5" width="13" height="13" rx="3"/>
    <path d="M124.8 147.5L128 140L131.2 147.5M125.9 145H130.1"/>
    <rect x="121" y="166" width="14" height="10" rx="1.5"/>
    <path d="M125 179H131M128 176V179"/>
    <path d="M123.5 193.5H130L133 196.5V206.5H123.5Z"/>
    <circle cx="128" cy="228" r="6.5"/>
    <path d="M128 224.5V231M125.2 228.4L128 231.2L130.8 228.4"/>
  </g>
  <g font-size="13" fill="#1D1D1F">
    <text x="142" y="120.5">Recents</text>
    <text x="142" y="148.5">Applications</text>
    <text x="142" y="176.5">Desktop</text>
    <text x="142" y="204.5">Documents</text>
    <text x="142" y="232.5">Downloads</text>
  </g>

  <!-- Toolbar -->
  <path d="M293 48L287 54L293 60" fill="none" stroke="#6E6E73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M309 48L315 54L309 60" fill="none" stroke="#C7C7CC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="59" font-size="14" font-weight="700" fill="#1D1D1F">ctc-adscope-manual-demo-main</text>
  <g fill="none" stroke="#6E6E73" stroke-width="1.8" stroke-linecap="round">
    <circle cx="631" cy="52" r="5.5"/>
    <path d="M635 56L640 61"/>
  </g>

  <!-- Files -->
  <g font-size="12.5" fill="#1D1D1F" text-anchor="middle">
    <!-- demo.html -->
    <use href="#page" x="310" y="105" width="50" height="62"/>
    <rect x="316" y="147" width="38" height="13" rx="3" fill="#E8590C"/>
    <text x="335" y="157" font-size="8.5" font-weight="700" fill="#FFFFFF">HTML</text>
    <text x="335" y="188">demo.html</text>

    <!-- favicon.svg -->
    <use href="#page" x="440" y="105" width="50" height="62"/>
    <rect x="446" y="147" width="38" height="13" rx="3" fill="#D97706"/>
    <text x="465" y="157" font-size="8.5" font-weight="700" fill="#FFFFFF">SVG</text>
    <text x="465" y="188">favicon.svg</text>

    <!-- images/ -->
    <rect x="567" y="110" width="22" height="10" rx="3" fill="#4FA3F0"/>
    <rect x="565" y="114" width="60" height="46" rx="5" fill="#4FA3F0"/>
    <rect x="565" y="122" width="60" height="40" rx="5" fill="#7CC2FB"/>
    <text x="595" y="188">images</text>

    <!-- index.html (selected) -->
    <rect x="297" y="234" width="76" height="74" rx="8" fill="#E2E2E7"/>
    <use href="#page" x="310" y="241" width="50" height="62"/>
    <rect x="316" y="283" width="38" height="13" rx="3" fill="#E8590C"/>
    <text x="335" y="293" font-size="8.5" font-weight="700" fill="#FFFFFF">HTML</text>
    <rect x="293" y="311" width="84" height="18" rx="5" fill="#0A63E0"/>
    <text x="335" y="324" fill="#FFFFFF">index.html</text>

    <!-- README.md -->
    <use href="#page" x="440" y="241" width="50" height="62"/>
    <rect x="446" y="283" width="38" height="13" rx="3" fill="#6E6E73"/>
    <text x="465" y="293" font-size="8.5" font-weight="700" fill="#FFFFFF">MD</text>
    <text x="465" y="324">README.md</text>

    <!-- styles.css -->
    <use href="#page" x="570" y="241" width="50" height="62"/>
    <rect x="576" y="283" width="38" height="13" rx="3" fill="#2563EB"/>
    <text x="595" y="293" font-size="8.5" font-weight="700" fill="#FFFFFF">CSS</text>
    <text x="595" y="324">styles.css</text>
  </g>

  <!-- Dock -->
  <rect x="198" y="510" width="365" height="76" rx="22" fill="#FFFFFF" fill-opacity="0.38" stroke="#FFFFFF" stroke-opacity="0.6"/>

  <!-- Finder -->
  <g filter="url(#soft-shadow)">
    <g clip-path="url(#finder-clip)">
      <rect x="210" y="520" width="56" height="56" fill="#8AD1FF"/>
      <path d="M241 520C239 532 237 540 235 550L240 551C239 560 239 568 240 576H266V520Z" fill="#2F80F2"/>
    </g>
  </g>
  <rect x="226" y="535" width="3.2" height="9" rx="1.6" fill="#1D1D1F"/>
  <rect x="247" y="535" width="3.2" height="9" rx="1.6" fill="#1D1D1F"/>
  <path d="M223 557Q238 567 253 557" fill="none" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="238" cy="581.5" r="2" fill="#1D1D1F" fill-opacity="0.6"/>

  <!-- Calendar -->
  <g filter="url(#soft-shadow)">
    <rect x="278" y="520" width="56" height="56" rx="13" fill="#FFFFFF"/>
  </g>
  <text x="306" y="537" font-size="9.5" font-weight="700" fill="#FF3B30" text-anchor="middle" letter-spacing="0.5">OCT</text>
  <text x="306" y="566" font-size="27" fill="#1D1D1F" text-anchor="middle">22</text>

  <!-- Notes -->
  <g filter="url(#soft-shadow)">
    <rect x="346" y="520" width="56" height="56" rx="13" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#notes-clip)">
    <rect x="346" y="520" width="56" height="15" fill="#FFCC2F"/>
  </g>
  <path d="M356 545H392M356 553H392M356 561H380" stroke="#D1D1D6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Chrome (drop target) -->
  <circle cx="442" cy="548" r="32" fill="#FFFFFF" fill-opacity="0.5"/>
  <g filter="url(#soft-shadow)">
    <path d="M442 548L442 536.5L464.2 536.5A25 25 0 0 0 420.94 534.53L432.04 553.75Z" fill="#EA4335"/>
    <path d="M442 548L451.96 553.75L440.86 572.97A25 25 0 0 0 464.2 536.5L442 536.5Z" fill="#FBBC04"/>
    <path d="M442 548L432.04 553.75L420.94 534.53A25 25 0 0 0 440.86 572.97L451.96 553.75Z" fill="#34A853"/>
    <circle cx="442" cy="548" r="11.5" fill="#FFFFFF"/>
    <circle cx="442" cy="548" r="9.3" fill="#1A73E8"/>
  </g>

  <!-- Separator + Trash -->
  <line x1="482.5" y1="524" x2="482.5" y2="572" stroke="#000000" stroke-opacity="0.15"/>
  <rect x="507" y="527" width="32" height="5" rx="2.5" fill="#E5E5EA" stroke="#A1A1A6"/>
  <path d="M510 533H536L533.5 569Q533.3 571 531 571H515Q512.7 571 512.5 569Z" fill="#FFFFFF" fill-opacity="0.85" stroke="#A1A1A6"/>
  <path d="M517 537L518 566M523 537V566M529 537L528 566" stroke="#C7C7CC"/>

  <!-- Drag path -->
  <path d="M336 340C336 400 360 455 412 478" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="7" stroke-linecap="round"/>
  <path d="M336 340C336 400 360 455 412 478" fill="none" stroke="#0A63E0" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>
  <path d="M10 0L-4 -7.5L-1 0L-4 7.5Z" transform="translate(412 478) rotate(24)" fill="#0A63E0" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" paint-order="stroke"/>

  <!-- Dragged copy of index.html, over Chrome -->
  <g transform="translate(423 470) scale(0.76)" opacity="0.8">
    <use href="#page" width="50" height="62"/>
    <rect x="6" y="42" width="38" height="13" rx="3" fill="#E8590C"/>
    <text x="25" y="52" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">HTML</text>
  </g>
  <path d="M0 0V17L4.2 13L7.2 19.5L10 18.3L7 12H12.5Z" transform="translate(454 485)" fill="#000000" stroke="#FFFFFF" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Callouts -->
  <g filter="url(#soft-shadow)">
    <rect x="190" y="422" width="150" height="32" rx="16" fill="#FFFFFF"/>
    <path d="M339 431L349 438L339 445Z" fill="#FFFFFF"/>
    <rect x="480" y="478" width="166" height="32" rx="16" fill="#FFFFFF"/>
    <path d="M481 487L471 494L481 501Z" fill="#FFFFFF"/>
  </g>
  <g font-size="14.5" font-weight="600" fill="#1D1D1F" text-anchor="middle">
    <text x="265" y="443">Drag <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5">index.html</tspan></text>
    <text x="563" y="499">Drop it on Chrome</text>
  </g>
</svg>
