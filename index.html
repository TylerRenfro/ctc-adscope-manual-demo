<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AdScope - Intelligent Ad Campaign Management</title>
  <meta name="description" content="Optimize your Google Ads campaigns based on weather, time, device, and network conditions. Maximize ROI with intelligent automation." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!--
    This whole site is plain HTML. There's nothing to install or build:
    drag this file into a browser window to open it.
    Tailwind (the styling) and Inter (the font) load from the internet.
  -->

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS: turns classes like "text-white" and "rounded-full" into styles -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>

  <!-- Our own styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="antialiased">
  <div class="min-h-screen bg-black">
    <header class="bg-black">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
          <!-- Logo -->
          <div class="flex items-center">
            <a href="index.html" class="flex items-center space-x-3">
              <svg class="w-8 h-8 text-white" fill="currentColor" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                <circle cx="12" cy="12" r="10" fill="none" />
                <circle cx="12" cy="12" r="6" fill="none" />
                <circle cx="12" cy="12" r="2" />
                <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke-linecap="round" />
              </svg>
              <span class="text-xl font-medium text-white">AdScope</span>
            </a>
          </div>

          <!-- Demo button -->
          <div class="hidden md:flex items-center">
            <a href="demo.html" class="bg-pink-300 text-black px-6 py-3 rounded-full hover:bg-pink-200 transition-colors font-medium">
              Schedule a Demo →
            </a>
          </div>
        </div>
      </div>
    </header>

    <main>
    </main>

    <footer class="bg-black text-white border-t border-gray-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="py-12">
          <div class="flex justify-center">
            <div class="flex flex-col items-center space-y-4">
              <a href="index.html" class="flex items-center space-x-3">
                <svg class="w-8 h-8 text-white" fill="currentColor" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                  <circle cx="12" cy="12" r="10" fill="none" />
                  <circle cx="12" cy="12" r="6" fill="none" />
                  <circle cx="12" cy="12" r="2" />
                  <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke-linecap="round" />
                </svg>
                <span class="text-xl font-medium">AdScope</span>
              </a>

              <p class="text-gray-400 text-center max-w-md">
                Intelligent ad campaign management that automatically optimizes your Google Ads
                based on weather, time, device, and network conditions.
              </p>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
